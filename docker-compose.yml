version: '3.8'

services:
  # ==========================================
  # Banco de Dados Principal: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: coper_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-coper_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coper_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coper_network

  # ==========================================
  # Cache e Gerenciamento de Sessão: Redis
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: coper_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coper_network

  # ==========================================
  # Interface Visual de Banco: PgAdmin 4
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: coper_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@coper.edu.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coper_network

networks:
  coper_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
